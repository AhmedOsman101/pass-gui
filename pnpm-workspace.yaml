packages:
  - client

allowBuilds:
  bufferutil: true
  es5-ext: true
  utf-8-validate: true
  vue-demi: true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - brace-expansion@5.0.7 || 5.0.8
  - shell-quote@1.8.5
  - '@hono/node-server@2.0.5'

onlyBuiltDependencies:
  - esbuild
  - vue-demi

packages:
  - client

allowBuilds:
  bufferutil: true
  es5-ext: true
  utf-8-validate: true
  vue-demi: true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - brace-expansion@2.1.3 || 2.1.4 || 5.0.7 || 5.0.8 || 5.0.9
  - shell-quote@1.8.5
  - '@hono/node-server@2.0.5'
  - lib-result@6.0.0
  - postcss@8.5.23
  - fast-uri@3.1.5
  - hono@4.12.34
  - nanoid@3.3.17

onlyBuiltDependencies:
  - esbuild
  - vue-demi

overrides:
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  decode-uri-component@<=0.4.2: ^0.5.0
  shell-quote@<=1.8.4: ^1.9.0

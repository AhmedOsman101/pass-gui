name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: taiki-e/install-action@v2
        with:
          tool: mask

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Level 1: Quick check (all pushes)
      - name: Typecheck
        run: mask typecheck

      - name: Lint
        run: mask lint --reporter github

      # Level 2: Release (tag push only)
      - name: Build
        if: startsWith(github.ref, 'refs/tags/v')
        run: mask build

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: mask release

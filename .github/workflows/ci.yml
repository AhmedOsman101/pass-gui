name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: taiki-e/install-action@v2
        with:
          tool: mask

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Level 1: Quick check (all pushes)
      - name: Typecheck
        run: mask typecheck

      - name: Lint
        run: mask lint --reporter github

      - name: Unit tests
        run: mask test unit

      # Level 2: Full check (PR to main or tag push)
      - name: Coverage
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        run: mask test coverage

      - name: Build Docker image for integration tests
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        run: docker build -t pass-gui-test -f Dockerfile .

      - name: Run integration tests
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        run: >
          docker run --rm
          -p 3000:3000 \
          -p 3001:3001 \
          -v ${{ github.workspace }}:/app
          -v ${{ github.workspace }}/neutralino.config.container.json:/app/neutralino.config.json:ro \
          -v ${{ github.workspace }}/.container/node_modules:/app/node_modules \
          -v ${{ github.workspace }}/.container/pnpm-store:/home/testuser/.local/share/pnpm/store \
          pass-gui-test \
          bash -c "pnpm install --frozen-lockfile; pnpm test:integration"

      # Level 3: Release (tag push only)
      - name: Build
        if: startsWith(github.ref, 'refs/tags/v')
        run: mask build

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: mask release
